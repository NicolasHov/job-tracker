<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compteur de silence — jours sans réponse recruteur</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@400;500;700&display=swap');

  :root {
    --bg: #000000;
    --bg-panel: #0a0a0a;
    --neon-pink: #ff2bd6;
    --neon-cyan: #2bf6ff;
    --neon-yellow: #f6ff2b;
    --neon-green: #39ff88;
    --gray: #4a4a52;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--neon-cyan);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .scanlines {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 10;
  }

  .machine {
    width: 100%;
    max-width: 440px;
    background: var(--bg-panel);
    border: 2px solid var(--neon-pink);
    border-radius: 18px;
    padding: 32px 28px 28px;
    box-shadow:
      0 0 18px rgba(255,43,214,0.45),
      inset 0 0 40px rgba(0,0,0,0.8);
    position: relative;
  }

  .marquee {
    text-align: center;
    font-family: 'VT323', monospace;
    font-size: 16px;
    letter-spacing: 3px;
    color: var(--neon-pink);
    text-transform: uppercase;
    margin-bottom: 22px;
    text-shadow: 0 0 8px rgba(255,43,214,0.7);
  }

  .screen {
    background: #000000;
    border: 2px solid var(--neon-cyan);
    border-radius: 8px;
    padding: 28px 16px;
    text-align: center;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 0 24px rgba(43,246,255,0.15);
  }

  .counter-label {
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--neon-cyan);
    text-transform: uppercase;
    margin-bottom: 8px;
    font-weight: 500;
    opacity: 0.8;
  }

  .counter-digits {
    font-family: 'VT323', monospace;
    font-size: 96px;
    line-height: 1;
    color: var(--neon-yellow);
    text-shadow:
      0 0 10px rgba(246,255,43,0.8),
      0 0 28px rgba(246,255,43,0.4);
    animation: flicker 4s infinite;
    letter-spacing: 4px;
  }

  .counter-digits.alert {
    color: var(--neon-pink);
    text-shadow: 0 0 10px rgba(255,43,214,0.8), 0 0 28px rgba(255,43,214,0.4);
  }

  @keyframes flicker {
    0%, 97%, 100% { opacity: 1; }
    98% { opacity: 0.85; }
    99% { opacity: 0.95; }
  }

  .counter-sub {
    font-size: 13px;
    color: var(--neon-cyan);
    margin-top: 10px;
    letter-spacing: 0.5px;
    min-height: 18px;
    opacity: 0.85;
  }

  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }

  .stat-box {
    background: #000000;
    border: 1px solid var(--neon-green);
    border-radius: 6px;
    padding: 12px 10px;
    text-align: center;
    box-shadow: inset 0 0 16px rgba(57,255,136,0.12);
  }

  .stat-value {
    font-family: 'VT323', monospace;
    font-size: 28px;
    color: var(--neon-green);
    text-shadow: 0 0 8px rgba(57,255,136,0.6);
  }

  .stat-label {
    font-size: 10px;
    color: var(--neon-green);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
    opacity: 0.75;
  }

  .footer-text {
    text-align: center;
    font-size: 11px;
    color: var(--gray);
    letter-spacing: 0.5px;
    margin-top: 4px;
  }

  .coffee-block {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px dashed rgba(255,43,214,0.3);
    text-align: center;
  }

  .coffee-title {
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: var(--neon-pink);
    text-shadow: 0 0 8px rgba(255,43,214,0.6);
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .coffee-sub {
    font-size: 11px;
    color: var(--neon-cyan);
    opacity: 0.75;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
    line-height: 1.5;
    padding: 0 8px;
  }

  .qr-wrap {
    display: inline-block;
    background: #ffffff;
    padding: 10px;
    border-radius: 8px;
    box-shadow: 0 0 14px rgba(255,43,214,0.35);
  }

  .qr-wrap img {
    display: block;
    width: 120px;
    height: 120px;
  }

  .coffee-handle {
    margin-top: 10px;
    font-family: 'VT323', monospace;
    font-size: 15px;
    color: var(--neon-yellow);
    text-shadow: 0 0 6px rgba(246,255,43,0.5);
    letter-spacing: 1px;
  }

  .blink-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--neon-green);
    margin-right: 6px;
    box-shadow: 0 0 6px rgba(57,255,136,0.8);
    animation: blink 2s infinite;
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.2; }
  }

  .status-line {
    text-align: center;
    font-size: 11px;
    color: var(--gray);
    margin-bottom: 16px;
    letter-spacing: 1px;
  }

  @media (max-width: 380px) {
    .counter-digits { font-size: 72px; }
  }
</style>
</head>
<body>

<div class="scanlines"></div>

<div class="machine">
  <div class="marquee">★ Bureau des candidatures ★</div>

  <div class="status-line" id="statusLine">
    <span class="blink-dot"></span><span id="statusText">connexion en cours</span>
  </div>

  <div class="screen">
    <div class="counter-label">jours sans contact (candidatures en attente)</div>
    <div class="counter-digits" id="dayCounter">--</div>
    <div class="counter-sub" id="counterSub">chargement</div>
  </div>

  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-value" id="totalApps">--</div>
      <div class="stat-label">candidatures</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="recordDays">--</div>
      <div class="stat-label">record silence</div>
    </div>
  </div>

  <div class="footer-text">dernière synchro : <span id="lastSync">--</span></div>

  <div class="coffee-block">
    <div class="coffee-title">☕ café du chômariat</div>
    <div class="coffee-sub">8 mois de loyer de bureau payé en expressos.<br>un petit café (viral) m'aiderait autant qu'un vrai.</div>
    <div class="qr-wrap">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https%3A%2F%2Finstagram.com%2Fchomariat_lifestyle" alt="QR code Instagram @chomariat_lifestyle" width="120" height="120">
    </div>
    <div class="coffee-handle">@chomariat_lifestyle</div>
  </div>
</div>

<script>
  // Remplacez par l'URL de votre fonction Vercel une fois déployée
  const API_URL = 'https://job-tracker-taupe-eight.vercel.app/api/stats';

  function getMessages(days) {
    if (days === 0) return "le silence vient de commencer";
    if (days < 7) return "encore dans la marge de politesse";
    if (days < 14) return "la marge de politesse a expiré";
    if (days < 30) return "ghosting confirmé";
    if (days < 60) return "silence radio niveau expert";
    return "candidature probablement archivée dans une autre dimension";
  }

  async function loadStats() {
    const statusText = document.getElementById('statusText');
    const dayCounterEl = document.getElementById('dayCounter');
    const counterSub = document.getElementById('counterSub');
    const totalAppsEl = document.getElementById('totalApps');
    const recordDaysEl = document.getElementById('recordDays');
    const lastSyncEl = document.getElementById('lastSync');

    try {
      const response = await fetch(API_URL);
      if (!response.ok) throw new Error('réponse API invalide');
      const data = await response.json();

      const days = data.daysSinceContact ?? 0;

      dayCounterEl.textContent = days;
      counterSub.textContent = getMessages(days);
      totalAppsEl.textContent = data.totalApplications ?? '--';
      recordDaysEl.textContent = data.recordDays ?? '--';

      if (days >= 21) {
        dayCounterEl.classList.add('alert');
      }

      const syncTime = new Date(data.updatedAt || Date.now());
      lastSyncEl.textContent = syncTime.toLocaleString('fr-FR', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });

      statusText.textContent = 'connecté au CRM';

    } catch (err) {
      statusText.textContent = 'connexion impossible';
      dayCounterEl.textContent = 'ERR';
      counterSub.textContent = 'vérifiez la config API';
      console.error(err);
    }
  }

  loadStats();
  setInterval(loadStats, 5 * 60 * 1000);
</script>

</body>
</html>
